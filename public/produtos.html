<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produtos — NEXO STORE</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div id="site-header"></div>

<main class="container section">
  <div class="catalog-layout">

    <aside class="filters card" style="padding:22px;">
      <h3 style="margin-bottom:4px;">Filtros</h3>

      <div class="filter-group">
        <h4>Categoria</h4>
        <div id="filter-categories"></div>
      </div>

      <div class="filter-group">
        <h4>Preço</h4>
        <div class="range-inputs">
          <input type="number" id="filter-min-price" class="input" placeholder="Mín." style="padding:8px 10px;">
          <span>—</span>
          <input type="number" id="filter-max-price" class="input" placeholder="Máx." style="padding:8px 10px;">
        </div>
        <button class="btn btn-ghost btn-sm btn-block" style="margin-top:10px;" id="apply-price-btn">Aplicar</button>
      </div>

      <div class="filter-group">
        <h4>Disponibilidade</h4>
        <label class="filter-option"><input type="checkbox" id="filter-in-stock"> Em estoque</label>
        <label class="filter-option"><input type="checkbox" id="filter-on-sale"> Em promoção</label>
        <label class="filter-option"><input type="checkbox" id="filter-new"> Novidades</label>
        <label class="filter-option"><input type="checkbox" id="filter-bestseller"> Mais vendidos</label>
      </div>

      <button class="btn btn-outline btn-block" id="clear-filters-btn">Limpar filtros</button>
    </aside>

    <section>
      <div class="toolbar">
        <div class="result-count" id="result-count">Carregando produtos...</div>
        <select class="input" id="sort-select" style="width:220px;">
          <option value="">Mais relevantes</option>
          <option value="price_asc">Menor preço</option>
          <option value="price_desc">Maior preço</option>
          <option value="rating">Melhor avaliados</option>
          <option value="bestseller">Mais vendidos</option>
          <option value="name">Nome A-Z</option>
        </select>
      </div>
      <div class="product-grid" id="catalog-grid"></div>
    </section>

  </div>
</main>

<div id="site-footer"></div>

<script src="/js/api.js"></script>
<script src="/js/components.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/products-ui.js"></script>
<script src="/js/products.js"></script>
</body>
</html>
